name: Check flights

on:
  schedule:
    # 2 buscas/run × 29 dias = 100 calls/mês no free tier SerpApi
    # Todos os dias às 00:00 BRT (29 runs) + seg–sex às 12:00 BRT (~21 runs) = ~50 runs × 2 = 100 calls
    # BR = UTC-3
    - cron: '0 3 * * *'    # 00:00 BRT — todos os dias
    - cron: '0 15 * * 1-5' # 12:00 BRT — seg a sex

  workflow_dispatch: {}  # permite rodar manual via UI

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        working-directory: Viagens_Tracker/Viagens/flight-tracker
        run: pip install -r requirements.txt

      - name: Run flight check
        working-directory: Viagens_Tracker/Viagens/flight-tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m app.main

      - name: Commit DB updates
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Viagens_Tracker/Viagens/flight-tracker/data/flights.db
          git diff --staged --quiet || git commit -m "chore: update price history"
          git push
