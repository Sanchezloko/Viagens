name: Check flights

on:
  schedule:
    # 2 buscas/run, mês de 31 dias = 100 calls/mês no free tier SerpApi
    # Agendado 1h30 antes do horário alvo para compensar delay médio do Actions
    # Meta: ~00:00 BRT todos os dias + ~12:00 BRT seg/qua/sex = ~44 runs × 2 = 88 calls
    # BR = UTC-3
    - cron: '30 1 * * *'     # meta 00:00 BRT — todos os dias
    - cron: '30 13 * * 1,3,5' # meta 12:00 BRT — seg, qua, sex

  workflow_dispatch: {}  # permite rodar manual via UI

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        working-directory: Viagens_Tracker/Viagens/flight-tracker
        run: pip install -r requirements.txt

      - name: Run flight check
        working-directory: Viagens_Tracker/Viagens/flight-tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m app.main

      - name: Commit DB updates
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Viagens_Tracker/Viagens/flight-tracker/data/flights.db
          git diff --staged --quiet || git commit -m "chore: update price history"
          git push
