name: Check flights

on:
  schedule:
    # 3x/dia = ~90 calls/mês — dentro do free tier do SerpApi (100/mês)
    # BR = UTC-3
    - cron: '0 3 * * *'   # 00:00 BRT (madrugada)
    - cron: '0 12 * * *'  # 09:00 BRT (manhã)
    - cron: '0 21 * * *'  # 18:00 BRT (fim do dia)

  workflow_dispatch: {}  # permite rodar manual via UI

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        working-directory: Viagens_Tracker/Viagens/flight-tracker
        run: pip install -r requirements.txt

      - name: Run flight check
        working-directory: Viagens_Tracker/Viagens/flight-tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m app.main

      - name: Commit DB updates
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Viagens_Tracker/Viagens/flight-tracker/data/flights.db
          git diff --staged --quiet || git commit -m "chore: update price history"
          git push
