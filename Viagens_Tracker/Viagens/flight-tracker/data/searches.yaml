# Cada item é uma busca ativa. Edite, adicione ou desative (ativo: false).
#
# Campos:
#   id              identificador único (qualquer string, sem espaços)
#   origem/destino  códigos IATA de aeroporto (GRU, GIG, LIS, MAD, JFK...)
#   ida_min/ida_max janela de datas pra ida (YYYY-MM-DD)
#   duracao_min_dias / duracao_max_dias   duração da viagem em dias
#                                         (alternativa a volta_min/volta_max)
#   pax             número de passageiros
#   classe          ECONOMY | PREMIUM_ECONOMY | BUSINESS | FIRST
#   preco_alvo      (opcional) se preço cair abaixo disso, alerta sempre
#   nao_paradas     (opcional) true = só voos diretos
#   step_dias       (opcional) granularidade da varredura de datas (default 3)
#   max_consultas_por_run  (opcional) limite de chamadas Amadeus por execução (default 8)
#   ativo           true/false

